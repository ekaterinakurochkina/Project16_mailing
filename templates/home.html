{% extends 'base.html' %}

{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for sending in object_list %}

          <div class="col">
            <div class="card shadow-sm">

              <div class="card-body">
                <p class="card-text">{{ sending.name }}</p>

                <p class="card-text">Владелец: {{ sending.owner }}</p>
                <!-- <p class="card-text">{{ product.description | truncatechars:100 }}</p> -->
                <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group">
                    {% if user.is_authenticated %} <!-- для зареганых пользователей будет видна кнопка Подробнее  -->
                    <a class="btn btn-primary" role="button" href="{% url 'mailing:sending_detail' sending.pk %}">Подробнее</a>
                    {% endif %}
                  </div>
                </div>
              </div>
            </div>
          </div>

        {% endfor %}
      </div>
    </div>
  </div>



{% endblock %}l>
